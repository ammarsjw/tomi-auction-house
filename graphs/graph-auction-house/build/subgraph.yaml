specVersion: 0.0.5
schema:
  file: schema.graphql
dataSources:
  - kind: ethereum
    name: AuctionHouse
    network: goerli
    source:
      address: "0x17BC084E63d61f11628ff2A3c654756f2c45d9C6"
      abi: AuctionHouse
      startBlock: 8980294
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - AuctionBid
        - AuctionBidLimitUpdated
        - AuctionCancelBid
        - AuctionClaim
        - AuctionCreated
        - AuctionDurationUpdated
        - AuctionFundsWalletUpdated
        - AuctionSettled
        - Initialized
      abis:
        - name: AuctionHouse
          file: AuctionHouse\abis\AuctionHouse.json
      eventHandlers:
        - event: AuctionBid(indexed uint256,uint256,address,uint256,uint256,address)
          handler: handleAuctionBid
        - event: AuctionBidLimitUpdated(uint256,uint256)
          handler: handleAuctionBidLimitUpdated
        - event: AuctionCancelBid(indexed uint256,uint256,address)
          handler: handleAuctionCancelBid
        - event: AuctionClaim(indexed uint256,uint256,address)
          handler: handleAuctionClaim
        - event: AuctionCreated(indexed uint256,uint256,uint256,uint256,uint256,uint256)
          handler: handleAuctionCreated
        - event: AuctionDurationUpdated(uint256,uint256)
          handler: handleAuctionDurationUpdated
        - event: AuctionFundsWalletUpdated(address,address)
          handler: handleAuctionFundsWalletUpdated
        - event: AuctionSettled(indexed uint256)
          handler: handleAuctionSettled
        - event: Initialized(uint8)
          handler: handleInitialized
      file: AuctionHouse\AuctionHouse.wasm
